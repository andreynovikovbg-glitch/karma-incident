<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>KARMA Incident — Official Links</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(circle at 50% 20%, #202020 0, #090909 42%, #030303 100%);
  color: #f0f0f0;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
}
.container {
  width: min(620px, 92vw);
  padding: 28px 0 34px;
  text-align: center;
}
.logo {
  width: min(360px, 76vw);
  height: auto;
  display: block;
  margin: 0 auto 14px;
  filter: brightness(1.65) contrast(1.08);
}
.tagline {
  color: #aaa;
  font-size: 14px;
  letter-spacing: 2px;
  margin: 0 0 28px;
  text-transform: uppercase;
}
.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.links a {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 76px;
  padding: 12px 22px;
  border: 1px solid #555;
  border-radius: 12px;
  background: linear-gradient(135deg, #151515, #0b0b0b);
  color: #fff;
  text-decoration: none;
  text-align: left;
  transition: transform .15s, border-color .15s, background .15s;
}
.links a:hover {
  transform: translateY(-2px);
  border-color: #999;
  background: #191919;
}
.icon {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  display: grid;
  place-items: center;
}
.icon svg { width: 44px; height: 44px; display: block; }
.youtube { color: #ff0000; }
.spotify { color: #1ed760; }
.instagram { color: #e1306c; }
.facebook { color: #1877f2; }
.soundcloud { color: #ff5500; }

.label {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .3px;
}
.arrow {
  font-size: 30px;
  color: #aaa;
  font-weight: 300;
}
.footer {
  margin-top: 30px;
  color: #666;
  font-size: 12px;
  letter-spacing: 1px;
}
</style>
</head>
