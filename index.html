<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARMA Incident — Official Links</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 50% 18%, #242424 0%, #151515 38%, #0b0b0b 100%);
  color:#f2f2f2;
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  width:min(430px,90vw);
  margin:0 auto;
  padding:28px 0 22px;
  text-align:center;
}
.logo{
  display: block;
  width: min(400px, 156vw);
  height: auto;
  transform: scale(1);
  margin: 0 auto 1px;
  max-width: 100%;
}
.tagline{
  margin:0 0 18px;
  color:#d0d0d0;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.links{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.links a{
  min-height:53px;
  display:flex;
  align-items:center;
  padding:7px 13px;
  border:1px solid rgba(210,210,210,.48);
  border-radius:9px;
  background:rgba(38,38,38,.62);
  color:#fff;
  text-decoration:none;
  text-align:left;
  box-shadow:0 1px 5px rgba(0,0,0,.25);
}
.icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  display:grid;
  place-items:center;
  margin-right:11px;
}
.brand-icon{width:29px;height:29px;display:block}
.youtube{color:#ff0000}
.spotify{color:#1ed760}
.instagram{color:#e1306c}
.facebook{color:#1877f2}
.soundcloud{color:#ff5500}
.info{flex:1;min-width:0}
.label{
  display:block;
  font-size:14px;
  font-weight:700;
  line-height:1.1;
}
.handle{
  display:block;
  margin-top:3px;
  color:#8e8e8e;
  font-size:10px;
  line-height:1.1;
}
.arrow{
  font-size:25px;
  line-height:1;
  color:#d0d0d0;
  font-weight:300;
  padding-left:8px;
}
.motto{
  margin:18px 0 10px;
  color:#999;
  font-size:10px;
  font-weight:600;
  letter-spacing:2.8px;
  text-transform:uppercase;
}
.motto span{color:#e31b23}
.footer{
  color:#777;
  font-size:9px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<main class="container">
<img class="logo" src="logo.png" alt="KARMA Incident">
<p class="tagline">Thrash Core · Sofia, Bulgaria</p>
<div class="links">

<a href="https://www.youtube.com/@karma.incident.official" target="_blank" rel="noopener">
<span class="icon"><img class="brand-icon" src="icons/youtube.svg" alt=""></span>
<span class="info"><span class="label">YouTube</span><span class="handle">@karma.incident.official</span></span><span class="arrow">›</span>
</a>

<a href="https://open.spotify.com/artist/3oTVBgQT5BO6HIU1hnlM?si=Gpd6KDONST7WHpDfh3Q0zg" target="_blank" rel="noopener">
<span class="icon"><img class="brand-icon" src="icons/spotify.svg" alt=""></span>
<span class="info"><span class="label">Spotify</span><span class="handle">Listen to our music</span></span><span class="arrow">›</span>
</a>

<a href="https://www.instagram.com/karma.incident" target="_blank" rel="noopener">
<span class="icon"><img class="brand-icon" src="icons/instagram.svg" alt=""></span>
<span class="info"><span class="label">Instagram</span><span class="handle">Photos · Reels · Behind the scenes</span></span><span class="arrow">›</span>
</a>

<a href="https://www.facebook.com/KARMA.Incident" target="_blank" rel="noopener">
<span class="icon"><img class="brand-icon" src="icons/facebook.svg" alt=""></span>
<span class="info"><span class="label">Facebook</span><span class="handle">News · Events · Community</span></span><span class="arrow">›</span>
</a>

<a href="https://soundcloud.com/karma_incident" target="_blank" rel="noopener">
<span class="icon"><img class="brand-icon" src="icons/soundcloud.svg" alt=""></span>
<span class="info"><span class="label">SoundCloud</span><span class="handle">Tracks · Demos · More</span></span><span class="arrow">›</span>
</a>

</div>
<div class="motto">Music · <span>Chaos</span> · No Compromise</div>
<div class="footer">KARMA Incident · Official Links</div>
</main>
</body>
</html>
