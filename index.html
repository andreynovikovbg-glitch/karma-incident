<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:#080808;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  width:min(560px,92vw);
  margin:0 auto;
  padding:28px 0 28px;
  text-align:center;
}
.logo{
  display:block;
  width:min(390px,82vw);
  max-height:260px;
  object-fit:contain;
  margin:0 auto 12px;
}
.tagline{
  margin:0 0 22px;
  color:#bdbdbd;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
}
.links{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.links a{
  min-height:68px;
  display:flex;
  align-items:center;
  padding:10px 18px;
  border:1px solid #555;
  border-radius:11px;
  background:#111;
  color:#fff;
  text-decoration:none;
  text-align:left;
}
.icon{
  width:44px;height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  margin-right:15px;
}
.icon svg{width:40px;height:40px;display:block}
.youtube{color:#ff0000}
.spotify{color:#1ed760}
.instagram{color:#e1306c}
.facebook{color:#1877f2}
.soundcloud{color:#ff5500}
.info{flex:1}
.label{
  display:block;
  font-size:17px;
  font-weight:700;
  line-height:1.15;
}
.handle{
  display:block;
  margin-top:3px;
  color:#888;
  font-size:12px;
  line-height:1.15;
}
.arrow{
  font-size:29px;
  color:#aaa;
  font-weight:300;
}
.motto{
  margin:28px 0 14px;
  color:#999;
  font-size:12px;
  font-weight:600;
  letter-spacing:3.5px;
  text-transform:uppercase;
}
.motto span{color:#e31b23}
.footer{
  color:#666;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
</style>
</head>
