<!DOCTYPE html>
<html lang="en">
<head>

<title>KARMA Incident — Official Links</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(ellipse at 50% 18%,#252525 0,#0c0c0c 38%,#030303 78%),
    #050505;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.16;
  background-image:
    repeating-linear-gradient(120deg,transparent 0 90px,rgba(255,255,255,.08) 91px,transparent 92px 180px);
}
.container{
  width:min(620px,92vw);
  margin:auto;
  padding:38px 0 34px;
  text-align:center;
}
.logo{
  display:block;
  width:min(455px,88vw);
  height:auto;
  margin:0 auto 18px;
  filter:brightness(1.65) contrast(1.08);
}
.tagline{
  margin:0 0 30px;
  color:#bdbdbd;
  font-size:14px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
.links{display:flex;flex-direction:column;gap:12px}
.links a{
  min-height:82px;
  display:flex;
  align-items:center;
  padding:13px 22px;
  border:1px solid #666;
  border-radius:13px;
  background:linear-gradient(100deg,rgba(20,20,20,.96),rgba(8,8,8,.96));
  color:#fff;
  text-decoration:none;
  text-align:left;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:.15s ease;
}
.links a:hover{transform:translateY(-2px);border-color:#aaa}
.icon{
  width:54px;height:54px;flex:0 0 54px;
  display:grid;place-items:center;margin-right:18px;
}
.icon svg{width:48px;height:48px;display:block}
.youtube{color:#ff0000}.spotify{color:#1ed760}.instagram{color:#e1306c}
.facebook{color:#1877f2}.soundcloud{color:#ff5500}
.label{
  flex:1;font-size:19px;font-weight:700;letter-spacing:.3px
}
.arrow{font-size:35px;color:#bbb;font-weight:300;line-height:1}
.motto{
  margin:42px 0 20px;
  color:#aaa;
  font-size:14px;
  font-weight:600;
  letter-spacing:5px;
  text-transform:uppercase;
}
.motto span{color:#e31b23}
.footer{
  color:#666;font-size:12px;letter-spacing:2px;
  text-transform:uppercase;
}
</style>
</head>
