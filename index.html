<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARMA Incident — Official Links</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #050505;
  color: #f0f0f0;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
}
.container {
  width: min(520px, 92vw);
  padding: 34px 0 28px;
  text-align: center;
}
.logo {
  width: min(300px, 72vw);
  height: auto;
  display: block;
  margin: 0 auto 22px;
}
.tagline {
  color: #999;
  font-size: 14px;
  margin: 0 0 26px;
  letter-spacing: .3px;
}
.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.links a {
  display: block;
  padding: 15px 18px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #111;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 600;
  transition: background .15s, border-color .15s;
}
.links a:hover {
  background: #1c1c1c;
  border-color: #777;
}
.footer {
  margin-top: 30px;
  color: #666;
  font-size: 12px;
}
</style>
</head>
<body>
<main class="container">
  <img class="logo" src="karma-logo.jpg" alt="KARMA Incident">
  <p class="tagline">Thrash core · Sofia, Bulgaria</p>

  <div class="links">
    <a href="https://www.youtube.com/@karma.incident" target="_blank" rel="noopener">YouTube</a>
    <a href="https://open.spotify.com/artist/3oTVBgQT5BO6HIU1hnlM?si=Gpd6KDONST7WHpDfh3Q0zg" target="_blank" rel="noopener">Spotify</a>
    <a href="https://www.instagram.com/karma.incident" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/KARMA.Incident" target="_blank" rel="noopener">Facebook</a>
    <a href="https://soundcloud.com/karma_incident" target="_blank" rel="noopener">SoundCloud</a>
  </div>

  <div class="footer">KARMA Incident · Official links</div>
</main>
</body>
</html>
